<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Praia en 3D · prueba | Smart Pools</title>
<style>
  :root { --ink: #0b1d2a; --blue: #0a6a94; --muted: #4a5873; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eaf4f9; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 38%, #ffffff 0%, #eaf4f9 55%, #d5e8f1 100%); touch-action: none; cursor: grab; }
  #stage.is-drag { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; left: 0; right: 0; pointer-events: none; display: flex; justify-content: center; padding: 0 16px; }
  .hud--top { top: max(18px, env(safe-area-inset-top)); flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .hud--top small { font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--blue); font-weight: 600; }
  .hud--top h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -.02em; }
  .hud--bottom { bottom: max(18px, env(safe-area-inset-bottom)); flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, .86); box-shadow: 0 8px 22px -14px rgba(10, 50, 80, .6); font-size: 13px; color: var(--muted); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .chip b { color: var(--ink); }
  .hint { transition: opacity .6s; }
  .hint.is-off { opacity: 0; }
  #fail { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud hud--top"><small>Vista 3D referencial</small><h1>Praia</h1></div>
<div class="hud hud--bottom">
  <span class="chip"><b>12 × 4 m</b> · profundidad <b>0,9 a 2,0 m</b></span>
  <span class="chip hint" id="hint">Arrastra para girar · rueda o pellizco para acercar</span>
</div>
<div id="fail">Tu navegador no pudo mostrar la vista 3D.</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- medidas de Praia (plano de forma y medidas) ----
const L = 12, W = 4, R = 0.38;              // largo, ancho, radio de esquina
const D_IN = 0.9, D_DEEP = 2.0;             // zona de entrada y zona profunda
const XMIN = -L / 2, XMAX = L / 2;
const WATER_Y = -0.14;

const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { document.getElementById('fail').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfd9e6, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(6, 14, 8);
scene.add(sun);

const pool = new THREE.Group();
scene.add(pool);

// ---- perfil: semiancho superior (esquinas redondeadas) y fondo con escalera ----
function hwTop(x) {
  const dx = Math.min(x - XMIN, XMAX - x);
  if (dx >= R) return W / 2;
  const k = R - Math.max(dx, 0);
  return W / 2 - R + Math.sqrt(Math.max(R * R - k * k, 0));
}
const lerp = (a, b, t) => a + (b - a) * Math.min(Math.max(t, 0), 1);
function floorY(x) {
  const s = x - XMIN;
  if (s < 0.07) return lerp(0, -0.3, s / 0.07);
  if (s <= 0.42) return -0.3;
  if (s <= 0.78) return -0.6;
  if (s <= 1.2) return -D_IN;
  if (s <= L - 2.0) return lerp(-D_IN, -D_DEEP, (s - 1.2) / (L - 3.2));
  if (s <= L - 0.26) return -D_DEEP;
  return lerp(-D_DEEP, 0, (s - (L - 0.26)) / 0.26);
}
// estaciones a lo largo: quiebres de escalera duplicados para que los peldaños queden nítidos
const st = new Set();
for (let s = 0; s <= L + 1e-6; s += 0.2) st.add(+s.toFixed(4));
for (let i = 0; i <= 8; i++) { st.add(+(R * i / 8).toFixed(4)); st.add(+(L - R * i / 8).toFixed(4)); }
[0.07, 0.42, 0.4203, 0.78, 0.7803, 1.2, L - 2.0, L - 0.26, L].forEach(v => st.add(+v.toFixed(4)));
const stations = [...st].sort((a, b) => a - b);

// ---- casco: superficie interior (pared + fondo) ----
const NV = 9, pos = [], idx = [];
stations.forEach(s => {
  const x = XMIN + s, y = floorY(x + (s === 0.4203 || s === 0.7803 ? 0.001 : -0.0005));
  const d = -y, ht = hwTop(x), hb = Math.max(ht - 0.11 * d, 0.05);
  const zs = [-ht, -hb, -hb * 0.66, -hb * 0.33, 0, hb * 0.33, hb * 0.66, hb, ht];
  zs.forEach((z, i) => pos.push(x, (i === 0 || i === NV - 1) ? 0 : y, z));
});
for (let i = 0; i < stations.length - 1; i++) for (let j = 0; j < NV - 1; j++) {
  const a = i * NV + j, b = a + 1, c = a + NV, d2 = c + 1;
  idx.push(a, c, b, b, c, d2);
}
const shellGeo = new THREE.BufferGeometry();
shellGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
shellGeo.setIndex(idx);
shellGeo.computeVertexNormals();
const shell = new THREE.Mesh(shellGeo, new THREE.MeshStandardMaterial({ color: 0x49c3e0, roughness: 0.38, metalness: 0.02, side: THREE.DoubleSide, envMapIntensity: 0.6 }));
pool.add(shell);

// ---- borde superior (pestaña del casco) ----
function roundedRect(shape, l, w, r) {
  const x = -l / 2, y = -w / 2;
  shape.moveTo(x + r, y); shape.lineTo(x + l - r, y); shape.absarc(x + l - r, y + r, r, -Math.PI / 2, 0, false);
  shape.lineTo(x + l, y + w - r); shape.absarc(x + l - r, y + w - r, r, 0, Math.PI / 2, false);
  shape.lineTo(x + r, y + w); shape.absarc(x + r, y + w - r, r, Math.PI / 2, Math.PI, false);
  shape.lineTo(x, y + r); shape.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return shape;
}
const rimShape = roundedRect(new THREE.Shape(), L + 0.46, W + 0.46, R + 0.23);
rimShape.holes.push(roundedRect(new THREE.Path(), L, W, R));
const rimGeo = new THREE.ExtrudeGeometry(rimShape, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 10 });
rimGeo.rotateX(-Math.PI / 2);
const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({ color: 0xf2f8fa, roughness: 0.4 }));
rim.position.y = -0.005;
pool.add(rim);

// ---- agua: malla que se deforma (chapoteo + ondas) ----
const NXW = 96, NZW = 14;
const wPos = new Float32Array((NXW + 1) * (NZW + 1) * 3), wBase = [], wIdx = [];
for (let i = 0; i <= NXW; i++) {
  const x = lerp(XMIN + 0.09, XMAX - 0.03, i / NXW), hw = hwTop(x) - 0.03;
  for (let j = 0; j <= NZW; j++) wBase.push(x, lerp(-hw, hw, j / NZW));
}
for (let i = 0; i < NXW; i++) for (let j = 0; j < NZW; j++) {
  const a = i * (NZW + 1) + j, b = a + 1, c = a + NZW + 1, d2 = c + 1;
  wIdx.push(a, b, c, b, d2, c);
}
const waterGeo = new THREE.BufferGeometry();
waterGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
waterGeo.setIndex(wIdx);
const water = new THREE.Mesh(waterGeo, new THREE.MeshPhysicalMaterial({
  color: 0x0a9fdc, transparent: true, opacity: 0.5, roughness: 0.1, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.08, envMapIntensity: 0.75, depthWrite: false
}));
pool.add(water);

// sombra suave bajo el casco
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(L + 9, W + 9), new THREE.MeshBasicMaterial({
  transparent: true, depthWrite: false,
  map: (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 8, 64, 64, 64); gr.addColorStop(0, 'rgba(40,60,75,.2)'); gr.addColorStop(.55, 'rgba(40,60,75,.07)'); gr.addColorStop(1, 'rgba(40,60,75,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })()
}));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = -D_DEEP - 0.25;
pool.add(shadow);

// ---- cámara y controles (giro del modelo + elevación + zoom) ----
let yaw = -0.5, yawVel = 0, elev = 0.56, zoom = 1, dragging = false, lastX = 0, lastY = 0, touched = false;
const pointers = new Map(); let pinch0 = 0, zoom0 = 1;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const dist = Math.max((L * 0.62) / Math.tan(hfov / 2), 15) * zoom;
  camera.position.set(0, Math.sin(elev) * dist - 0.6, Math.cos(elev) * dist);
  camera.lookAt(0, -0.9, 0); camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoom0 = zoom; }
  dragging = true; lastX = e.clientX; lastY = e.clientY; stage.classList.add('is-drag');
  if (!touched) { touched = true; document.getElementById('hint').classList.add('is-off'); }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoom = THREE.MathUtils.clamp(zoom0 * pinch0 / Math.max(Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), 1), 0.55, 1.6); fit(); return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  yawVel = dx * 0.0085 * 60;                       // rad/s aprox.
  yaw += dx * 0.0085;
  elev = THREE.MathUtils.clamp(elev + dy * 0.005, 0.2, 1.3); fit();
});
const up = e => { pointers.delete(e.pointerId); if (!pointers.size) { dragging = false; stage.classList.remove('is-drag'); } };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { e.preventDefault(); zoom = THREE.MathUtils.clamp(zoom * (1 + Math.sign(e.deltaY) * 0.08), 0.55, 1.6); fit(); }, { passive: false });

// ---- chapoteo: el agua queda "atrás" cuando giras el casco y luego vuelve (resorte amortiguado) ----
let sx = 0, vx = 0, sz = 0, vz = 0, prevYawVel = 0, energy = 0, t = 0, last = performance.now();
const K = 10, C = 1.25;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt;
  if (!dragging) {
    yaw += yawVel * dt; yawVel *= Math.pow(0.04, dt);
    if (!touched) yawVel += Math.cos(t * 0.9) * 0.9 * dt;       // vaivén suave mientras nadie lo toca
  }
  const dW = yawVel - prevYawVel; prevYawVel = yawVel;
  vz += dW * 0.055; vx += dW * 0.011;                             // el giro empuja el agua
  vx += (-K * sx - C * vx) * dt; sx += vx * dt;
  vz += (-K * 1.9 * sz - C * vz) * dt; sz += vz * dt;
  sx = THREE.MathUtils.clamp(sx, -0.014, 0.014); sz = THREE.MathUtils.clamp(sz, -0.05, 0.05);
  energy = lerp(energy, Math.min(Math.abs(vz) * 6 + Math.abs(vx) * 22 + Math.abs(yawVel) * 0.12, 1), 0.08);
  const amp = 0.008 + energy * 0.03;
  for (let i = 0, n = wBase.length / 2; i < n; i++) {
    const x = wBase[i * 2], z = wBase[i * 2 + 1];
    let h = sx * x + sz * z
      + Math.sin(Math.PI * x / L) * vx * 0.9                       // onda larga que va y vuelve
      + amp * (Math.sin(x * 1.9 + t * 1.7) * 0.5 + Math.sin(x * 3.3 - z * 2.1 + t * 2.3) * 0.3 + Math.sin(z * 4.2 + x * 0.7 + t * 2.9) * 0.2);
    wPos[i * 3] = x; wPos[i * 3 + 1] = Math.min(WATER_Y + h, -0.025); wPos[i * 3 + 2] = z;
  }
  waterGeo.attributes.position.needsUpdate = true; waterGeo.computeVertexNormals();
  pool.rotation.y = yaw;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
fit();
requestAnimationFrame(frame);
window.__pool3d = { ready: true };
</script>
</body>
</html>
