<style>

<body>
<div id="stage"></div>
<div class="hud hud--top"><small>Vista 3D referencial</small><h1>Praia</h1></div>
<div class="hud hud--bottom">
  <span class="chip"><b>12 × 4 m</b> · profundidad <b>0,9 a 2,0 m</b></span>
  <span class="chip hint" id="hint">Arrastra para girar (más rápido, más olas) · toca el agua</span>
</div>
<div id="fail">Tu navegador no pudo mostrar la vista 3D.</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- medidas de Praia (plano de forma y medidas) ----
const L = 12, W = 4, R = 0.38;              // largo, ancho, radio de esquina
const D_IN = 0.9, D_DEEP = 2.0;             // zona de entrada y zona profunda
const XMIN = -L / 2, XMAX = L / 2;
const WATER_Y = -0.14;

const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { document.getElementById('fail').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfd9e6, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(6, 14, 8);
scene.add(sun);

const pool = new THREE.Group();
scene.add(pool);

// ---- perfil: semiancho superior (esquinas redondeadas) y fondo con escalera ----
function hwTop(x) {
  const dx = Math.min(x - XMIN, XMAX - x);
  if (dx >= R) return W / 2;
  const k = R - Math.max(dx, 0);
  return W / 2 - R + Math.sqrt(Math.max(R * R - k * k, 0));
}
const lerp = (a, b, t) => a + (b - a) * Math.min(Math.max(t, 0), 1);
function floorY(x) {
  const s = x - XMIN;
  if (s < 0.07) return lerp(0, -0.3, s / 0.07);
  if (s <= 0.42) return -0.3;
  if (s <= 0.78) return -0.6;
  if (s <= 1.2) return -D_IN;
  if (s <= L - 2.0) return lerp(-D_IN, -D_DEEP, (s - 1.2) / (L - 3.2));
  if (s <= L - 0.26) return -D_DEEP;
  return lerp(-D_DEEP, 0, (s - (L - 0.26)) / 0.26);
}
// estaciones a lo largo: quiebres de escalera duplicados para que los peldaños queden nítidos
const st = new Set();
for (let s = 0; s <= L + 1e-6; s += 0.2) st.add(+s.toFixed(4));
for (let i = 0; i <= 8; i++) { st.add(+(R * i / 8).toFixed(4)); st.add(+(L - R * i / 8).toFixed(4)); }
[0.07, 0.42, 0.4203, 0.78, 0.7803, 1.2, L - 2.0, L - 0.26, L].forEach(v => st.add(+v.toFixed(4)));
const stations = [...st].sort((a, b) => a - b);

// ---- casco: superficie interior (pared + fondo) ----
const NV = 9, pos = [], idx = [];
stations.forEach(s => {
  const x = XMIN + s, y = floorY(x + (s === 0.4203 || s === 0.7803 ? 0.001 : -0.0005));
  const d = -y, ht = hwTop(x), hb = Math.max(ht - 0.11 * d, 0.05);
  const zs = [-ht, -hb, -hb * 0.66, -hb * 0.33, 0, hb * 0.33, hb * 0.66, hb, ht];
  zs.forEach((z, i) => pos.push(x, (i === 0 || i === NV - 1) ? 0 : y, z));
});
for (let i = 0; i < stations.length - 1; i++) for (let j = 0; j < NV - 1; j++) {
  const a = i * NV + j, b = a + 1, c = a + NV, d2 = c + 1;
  idx.push(a, c, b, b, c, d2);
}
const shellGeo = new THREE.BufferGeometry();
shellGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
shellGeo.setIndex(idx);
shellGeo.computeVertexNormals();
const shell = new THREE.Mesh(shellGeo, new THREE.MeshStandardMaterial({ color: 0x49c3e0, roughness: 0.38, metalness: 0.02, side: THREE.DoubleSide, envMapIntensity: 0.6 }));
pool.add(shell);

// ---- borde superior (pestaña del casco) ----
function roundedRect(shape, l, w, r) {
  const x = -l / 2, y = -w / 2;
  shape.moveTo(x + r, y); shape.lineTo(x + l - r, y); shape.absarc(x + l - r, y + r, r, -Math.PI / 2, 0, false);
  shape.lineTo(x + l, y + w - r); shape.absarc(x + l - r, y + w - r, r, 0, Math.PI / 2, false);
  shape.lineTo(x + r, y + w); shape.absarc(x + r, y + w - r, r, Math.PI / 2, Math.PI, false);
  shape.lineTo(x, y + r); shape.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return shape;
}
const rimShape = roundedRect(new THREE.Shape(), L + 0.46, W + 0.46, R + 0.23);
rimShape.holes.push(roundedRect(new THREE.Path(), L, W, R));
const rimGeo = new THREE.ExtrudeGeometry(rimShape, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 10 });
rimGeo.rotateX(-Math.PI / 2);
const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({ color: 0xf2f8fa, roughness: 0.4 }));
rim.position.y = -0.005;
pool.add(rim);

// ---- texturas procedurales: micro-ondas (relieve) y cáusticas (luz en el fondo) ----
function makeTex(fn, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), im = g.createImageData(size, size), d = im.data, k = Math.PI * 2 / size;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const o = (y * size + x) * 4, v = fn(x * k, y * k); d[o] = v[0]; d[o + 1] = v[1]; d[o + 2] = v[2]; d[o + 3] = 255; }
  g.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const rippleH = (x, y) => Math.sin(3 * x + 2 * y) * 0.5 + Math.sin(5 * x - 4 * y + 1.3) * 0.3 + Math.sin(7 * y + 2 * x + 0.7) * 0.25 + Math.sin(9 * x + 6 * y) * 0.15 + Math.sin(11 * y - 8 * x + 2.1) * 0.1;
const normalTex = makeTex((x, y) => {
  const e = 0.02, dx = (rippleH(x + e, y) - rippleH(x - e, y)) / (2 * e), dy = (rippleH(x, y + e) - rippleH(x, y - e)) / (2 * e);
  const l = Math.hypot(dx * 0.35, dy * 0.35, 1);
  return [(-dx * 0.35 / l * 0.5 + 0.5) * 255, (-dy * 0.35 / l * 0.5 + 0.5) * 255, (1 / l * 0.5 + 0.5) * 255];
}, 256);
normalTex.repeat.set(5, 1.7);
// ---- agua simulada: ecuaciones de aguas someras en una grilla (las olas viajan y rebotan en las paredes) ----
const NX = 120, NZ = 40, DX = L / NX, DZ = W / NZ;
const G = 6.5, H0 = 2.0;                      // gravedad y profundidad "visuales" (definen la velocidad de la ola)
const hgt = new Float32Array(NX * NZ), uu = new Float32Array((NX + 1) * NZ), ww = new Float32Array(NX * (NZ + 1));
const wPos = new Float32Array(NX * NZ * 3), wNor = new Float32Array(NX * NZ * 3), wUv = new Float32Array(NX * NZ * 2), wIdx = [];
const gx = new Float32Array(NX), gz = new Float32Array(NX * NZ);
for (let i = 0; i < NX; i++) {
  const x = lerp(XMIN + 0.03, XMAX - 0.03, i / (NX - 1)), hw = hwTop(x) - 0.03; gx[i] = x;
  for (let j = 0; j < NZ; j++) { const z = lerp(-hw, hw, j / (NZ - 1)), o = i * NZ + j; gz[o] = z; wUv[o * 2] = x / L; wUv[o * 2 + 1] = z / W; }
}
for (let i = 0; i < NX - 1; i++) for (let j = 0; j < NZ - 1; j++) { const a = i * NZ + j, b = a + 1, c = a + NZ, d2 = c + 1; wIdx.push(a, b, c, b, d2, c); }
const waterGeo = new THREE.BufferGeometry();
waterGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
waterGeo.setAttribute('normal', new THREE.BufferAttribute(wNor, 3));
waterGeo.setAttribute('uv', new THREE.BufferAttribute(wUv, 2));
waterGeo.setIndex(wIdx);
const water = new THREE.Mesh(waterGeo, new THREE.MeshPhysicalMaterial({
  color: 0x0c8fd6, transparent: true, opacity: 0.66, roughness: 0.04, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.03,
  envMapIntensity: 1.25, normalMap: normalTex, normalScale: new THREE.Vector2(0.22, 0.22), depthWrite: false, side: THREE.DoubleSide
}));
water.renderOrder = 2;
pool.add(water);

// ---- salpicadura: gotas de la misma agua, lanzadas con la velocidad con que la ola golpea la pared ----
const NP = 260, pPos = new Float32Array(NP * 3), pVel = new Float32Array(NP * 3), pLife = new Float32Array(NP), pSize = new Float32Array(NP);
let pNext = 0;
const drops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshPhysicalMaterial({
  color: 0x1c9be0, transparent: true, opacity: 0.82, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.3
}), NP);
drops.frustumCulled = false; drops.renderOrder = 3;
const dM = new THREE.Matrix4(), dQ = new THREE.Quaternion(), dS = new THREE.Vector3(), dP = new THREE.Vector3(), dV = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
dM.makeScale(0, 0, 0); for (let k = 0; k < NP; k++) drops.setMatrixAt(k, dM);
pool.add(drops);
function spawnDrop(x, y, z, vx, vy, vz, size) {
  const o = pNext * 3; pPos[o] = x; pPos[o + 1] = y; pPos[o + 2] = z; pVel[o] = vx; pVel[o + 1] = vy; pVel[o + 2] = vz;
  pLife[pNext] = 3; pSize[pNext] = size || (0.04 + Math.random() * 0.035); pNext = (pNext + 1) % NP;
}
function poke(x, z, amount) {                 // deja una onda donde cae algo
  const ci = Math.round((x - XMIN) / L * (NX - 1)), cj = Math.round((z / W + 0.5) * (NZ - 1));
  for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) { const i = ci + a, j = cj + b; if (i < 0 || j < 0 || i >= NX || j >= NZ) continue; hgt[i * NZ + j] += amount * Math.exp(-(a * a + b * b) / 2.2); }
}
const H_SPLASH = 0.12;                        // altura sobre el nivel en reposo a la que el agua toca el borde
function simulate(dt, alpha, omega) {
  const damp = Math.exp(-0.42 * dt);
  for (let i = 1; i < NX; i++) { const xf = XMIN + i * DX; for (let j = 0; j < NZ; j++) {
    const z = (j + 0.5) * DZ - W / 2, o = i * NZ + j;
    uu[o] = (uu[o] + dt * (-G * (hgt[i * NZ + j] - hgt[(i - 1) * NZ + j]) / DX - alpha * z * 0.017 + omega * omega * xf * 0.02)) * damp; } }
  for (let i = 0; i < NX; i++) { const x = XMIN + (i + 0.5) * DX; for (let j = 1; j < NZ; j++) {
    const zf = j * DZ - W / 2, o = i * (NZ + 1) + j;
    ww[o] = (ww[o] + dt * (-G * (hgt[i * NZ + j] - hgt[i * NZ + j - 1]) / DZ + alpha * x * 0.017 + omega * omega * zf * 0.02)) * damp; } }
  let spawned = 0;
  for (let i = 0; i < NX; i++) for (let j = 0; j < NZ; j++) {
    const o = i * NZ + j;
    hgt[o] -= dt * H0 * ((uu[(i + 1) * NZ + j] - uu[o]) / DX + (ww[i * (NZ + 1) + j + 1] - ww[i * (NZ + 1) + j]) / DZ);
    if (hgt[o] > H_SPLASH) {                  // la ola llegó al borde: el exceso sale despedido
      const ex = hgt[o] - H_SPLASH; hgt[o] = H_SPLASH;
      const nx = i < 2 ? -1 : i > NX - 3 ? 1 : 0, nz = j < 2 ? -1 : j > NZ - 3 ? 1 : 0;
      if ((nx || nz) && spawned < 3) {
        // velocidad del agua en esa celda (la misma que mueve la ola)
        const ux = (uu[o] + uu[(i + 1) * NZ + j]) * 0.5, wz = (ww[i * (NZ + 1) + j] + ww[i * (NZ + 1) + j + 1]) * 0.5;
        const hitSpeed = Math.max(ux * nx + wz * nz, 0) + Math.sqrt(ex) * 0.9;      // qué tan fuerte choca contra la pared
        if (hitSpeed > 0.24 && Math.random() < hitSpeed * 0.4) {
          const n = 1 + (Math.random() * Math.min(hitSpeed * 2.2, 3) | 0);
          for (let k = 0; k < n; k++) {
            const up = 1.1 + hitSpeed * 2.6 * (0.6 + Math.random() * 0.5), out = 0.15 + hitSpeed * 0.9 * Math.random();
            spawnDrop(gx[i] + (Math.random() - 0.5) * (nz ? 0.7 : 0.15), 0.0, gz[o] + (Math.random() - 0.5) * (nx ? 0.7 : 0.15),
              nx * out + ux * 0.6 + (Math.random() - 0.5) * 0.25, up, nz * out + wz * 0.6 + (Math.random() - 0.5) * 0.25,
              0.04 + Math.min(hitSpeed, 1.2) * 0.045 * Math.random() + Math.random() * 0.02);
          }
          spawned += n;
        }
      }
    } else if (hgt[o] < -0.26) hgt[o] = -0.26;
  }
}
function updateDrops(dt) {
  for (let k = 0; k < NP; k++) {
    if (pLife[k] <= 0) continue;
    const o = k * 3; pLife[k] -= dt; pVel[o + 1] -= 9.8 * dt;
    pPos[o] += pVel[o] * dt; pPos[o + 1] += pVel[o + 1] * dt; pPos[o + 2] += pVel[o + 2] * dt;
    const inside = Math.abs(pPos[o]) < L / 2 - 0.05 && Math.abs(pPos[o + 2]) < W / 2 - 0.05;
    if (pVel[o + 1] < 0 && pPos[o + 1] < WATER_Y && inside) { poke(pPos[o], pPos[o + 2], -pSize[k] * 0.35); pLife[k] = 0; }
    if (pLife[k] <= 0 || pPos[o + 1] < -D_DEEP - 0.5) { pLife[k] = 0; dM.makeScale(0, 0, 0); drops.setMatrixAt(k, dM); continue; }
    dV.set(pVel[o], pVel[o + 1], pVel[o + 2]); const sp = dV.length(), r = pSize[k];
    dQ.setFromUnitVectors(UP, dV.multiplyScalar(1 / Math.max(sp, 0.001)));
    dS.set(r, r * (1 + Math.min(sp * 0.22, 1.6)), r); dP.set(pPos[o], pPos[o + 1], pPos[o + 2]);
    drops.setMatrixAt(k, dM.compose(dP, dQ, dS));
  }
  drops.instanceMatrix.needsUpdate = true;
}
function updateWaterMesh() {
  for (let i = 0; i < NX; i++) for (let j = 0; j < NZ; j++) {
    const o = i * NZ + j, p = o * 3;
    wPos[p] = gx[i]; wPos[p + 1] = Math.min(WATER_Y + hgt[o], 0.02); wPos[p + 2] = gz[o];
    const hx = (hgt[Math.min(i + 1, NX - 1) * NZ + j] - hgt[Math.max(i - 1, 0) * NZ + j]) / (2 * DX) * 1.6;
    const hz = (hgt[i * NZ + Math.min(j + 1, NZ - 1)] - hgt[i * NZ + Math.max(j - 1, 0)]) / (2 * DZ) * 1.6;
    const l = 1 / Math.hypot(hx, 1, hz); wNor[p] = -hx * l; wNor[p + 1] = l; wNor[p + 2] = -hz * l;
  }
  waterGeo.attributes.position.needsUpdate = true; waterGeo.attributes.normal.needsUpdate = true;
}

// sombra suave bajo el casco
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(L + 9, W + 9), new THREE.MeshBasicMaterial({
  transparent: true, depthWrite: false,
  map: (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 8, 64, 64, 64); gr.addColorStop(0, 'rgba(40,60,75,.2)'); gr.addColorStop(.55, 'rgba(40,60,75,.07)'); gr.addColorStop(1, 'rgba(40,60,75,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })()
}));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = -D_DEEP - 0.25;
pool.add(shadow);

// ---- cámara y controles (giro del modelo + elevación + zoom) ----
let yaw = -0.5, yawVel = 0, elev = 0.56, zoom = 1, dragging = false, lastX = 0, lastY = 0, touched = false;
const pointers = new Map(); let pinch0 = 0, zoom0 = 1;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const dist = Math.max((L * 0.62) / Math.tan(hfov / 2), 15) * zoom;
  camera.position.set(0, Math.sin(elev) * dist - 0.6, Math.cos(elev) * dist);
  camera.lookAt(0, -0.9, 0); camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoom0 = zoom; }
  dragging = true; lastX = e.clientX; lastY = e.clientY; stage.classList.add('is-drag');
  if (!touched) { touched = true; document.getElementById('hint').classList.add('is-off'); }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoom = THREE.MathUtils.clamp(zoom0 * pinch0 / Math.max(Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), 1), 0.55, 1.6); fit(); return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  yawVel = dx * 0.0085 * 60;                       // rad/s aprox.
  yaw += dx * 0.0085;
  elev = THREE.MathUtils.clamp(elev + dy * 0.005, 0.2, 1.3); fit();
});
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.14), hit = new THREE.Vector3();
let downX = 0, downY = 0;
stage.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
const up = e => {
  if (pointers.size === 1 && Math.hypot(e.clientX - downX, e.clientY - downY) < 6) {
    const r = stage.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    if (ray.ray.intersectPlane(plane, hit)) { pool.worldToLocal(hit); if (Math.abs(hit.x) < L / 2 - 0.2 && Math.abs(hit.z) < W / 2 - 0.2) { poke(hit.x, hit.z, -0.11); for (let k = 0; k < 4; k++) spawnDrop(hit.x, WATER_Y, hit.z, (Math.random() - 0.5) * 0.7, 1.4 + Math.random() * 1.1, (Math.random() - 0.5) * 0.7); } }
  }
  pointers.delete(e.pointerId); if (!pointers.size) { dragging = false; stage.classList.remove('is-drag'); } };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { e.preventDefault(); zoom = THREE.MathUtils.clamp(zoom * (1 + Math.sign(e.deltaY) * 0.08), 0.55, 1.6); fit(); }, { passive: false });

// ---- animación: el giro del casco empuja el agua (fuerzas de inercia), que luego oscila y rebota ----
let prevYaw = yaw, omega = 0, prevOmega = 0, t = 0, last = performance.now(), nextRain = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.04); last = now; t += dt;
  if (!dragging) {
    yaw += yawVel * dt; yawVel *= Math.pow(0.05, dt);
    if (!touched) yawVel += Math.cos(t * 0.8) * 1.3 * dt;         // vaivén suave mientras nadie lo toca
  }
  if (dt > 0.0005) {
    omega = lerp(omega, (yaw - prevYaw) / dt, 0.45); prevYaw = yaw;
    const alpha = THREE.MathUtils.clamp((omega - prevOmega) / dt, -55, 55); prevOmega = omega;
    const w = THREE.MathUtils.clamp(omega, -4.5, 4.5), sub = 3;
    for (let k = 0; k < sub; k++) simulate(dt / sub, alpha, w);
  }
  if (t > nextRain) { poke(lerp(XMIN + 1, XMAX - 1, Math.random()), (Math.random() - 0.5) * (W - 1), (Math.random() - 0.5) * 0.02); nextRain = t + 0.5 + Math.random(); }
  updateDrops(dt); updateWaterMesh();
  normalTex.offset.set(t * 0.035, t * 0.021);
  pool.rotation.y = yaw;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
fit();
requestAnimationFrame(frame);
window.__pool3d = { ready: true, stats: () => { let mx = 0, n = 0; for (let i = 0; i < hgt.length; i++) mx = Math.max(mx, Math.abs(hgt[i])); for (let k = 0; k < NP; k++) if (pLife[k] > 0) n++; return { maxH: +mx.toFixed(3), drops: n, omega: +omega.toFixed(2), nan: hgt.some(v => v !== v) }; }, spin: v => { touched = true; yawVel = v; } };
</script>
